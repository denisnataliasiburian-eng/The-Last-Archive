<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access | The Last Archive</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-grain"></div>

        <section class="login-container">

            <p class="login-label">
                THE LAST ARCHIVE
            </p>

            <div class="divider"></div>

            <h1>ACCESS</h1>

            <p class="login-description">
                Every archive has a key.
            </p>

            <form id="loginForm">

                <div class="input-group">

                    <label for="archiveId">
                        ARCHIVE ID
                    </label>

                    <input
                        type="text"
                        id="archiveId"
                        placeholder="ARCHIVE-XX"
                        autocomplete="off"
                        required
                    >

                </div>


                <div class="input-group">
    <label for="accessKey">ACCESS KEY</label>

    <div class="password-wrapper">
        <input 
            type="password" 
            id="accessKey" 
            placeholder="••••••••" 
            required
        >

        <button 
    type="button" 
    class="toggle-password" 
    onclick="togglePassword()"
>👁</button>
    </div>
</div>


                <button type="submit" class="unlock-btn">
                    UNLOCK
                </button>

            </form>


            <p id="loginMessage" class="login-message"></p>

            <p class="login-status">
                ARCHIVE STATUS: LOCKED
            </p>

        </section>

    </main>


    <script>

const accounts = {

    "ARCHIVE-01": {
        password: "adelia123",
        name: "ADELIA",
        archive: "archive-adelia.html"
    },

    "ARCHIVE-02": {
        password: "denis123",
        name: "DENIS",
        archive: "archive-natalia.html"
    },

    "ARCHIVE-03": {
        password: "gene123",
        name: "SHANI",
        archive: "archive-gene.html"
    },

    "ARCHIVE-04": {
        password: "galang123",
        name: "GALANG",
        archive: "archive-galang.html"
    }

};


const loginForm = document.getElementById("loginForm");
const loginMessage = document.getElementById("loginMessage");


loginForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const archiveId = document
        .getElementById("archiveId")
        .value
        .trim()
        .toUpperCase();

    const accessKey = document
        .getElementById("accessKey")
        .value;


    const account = accounts[archiveId];


    if (account && account.password === accessKey) {

        loginMessage.textContent =
            "ARCHIVE ACCESS GRANTED.";

        loginMessage.classList.add("success");


        setTimeout(function() {

            window.location.href = account.archive;

        }, 1000);


    } else {

        loginMessage.textContent =
            "ACCESS DENIED — INVALID ARCHIVE KEY.";

        loginMessage.classList.remove("success");

    }

});
        function togglePassword() {
    const password = document.getElementById("accessKey");
    const eye = document.querySelector(".toggle-password");

    if (password.type === "password") {
        password.type = "text";
        eye.textContent = "🙈";
    } else {
        password.type = "password";
        eye.textContent = "👁";
    }
}

</script>

</body>

</html>
